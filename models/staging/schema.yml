version: 2

sources:
  - name: financial
    schema: financial
    description: "Raw financial data tables loaded by external ingestion tools"
    tables:
      - name: customer
        description: >
          Raw customer data loaded by an external ingestion tool (replacing
          FastLoad/MultiLoad/TPT load scripts). Contains demographic and
          banking relationship attributes for each customer.
        columns:
          - name: cust_id
            description: "Unique customer identifier (e.g. C0001)"
            tests:
              - unique
              - not_null
          - name: income
            description: "Annual income of the customer"
          - name: age
            description: "Age of the customer in years"
          - name: years_with_bank
            description: "Number of years the customer has banked with the institution"
          - name: nbr_children
            description: "Number of children the customer has"
          - name: gender
            description: "Gender code of the customer (M = Male, F = Female)"
            tests:
              - accepted_values:
                  values: ['M', 'F']
          - name: marital_status
            description: "Marital status code (Y = Married, N = Not married)"
            tests:
              - accepted_values:
                  values: ['Y', 'N']

models:
  - name: stg_customer
    description: >
      Staging model that selects from the raw customer source table and applies
      type casting to normalize column types. Replaces the CAST expressions found
      in the original TPT export scripts (Export.tpt.txt, tptscript.txt).
    columns:
      - name: cust_id
        description: "Customer identifier cast to CHAR(25)"
        tests:
          - unique
          - not_null
      - name: income
        description: "Income cast to CHAR(25)"
      - name: age
        description: "Age cast to CHAR(2)"
      - name: years_with_bank
        description: "Years with bank cast to CHAR(2)"
      - name: nbr_children
        description: "Number of children cast to CHAR(2)"
      - name: gender
        description: "Gender code cast to CHAR(2)"
      - name: marital_status
        description: "Marital status code cast to CHAR(2)"
